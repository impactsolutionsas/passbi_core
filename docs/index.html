<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassBi Docs — Transit Routing API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/green-screen.min.css" />
  <style>
    /* ─── Reset & Tokens ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #070E0D;
      --bg-2:          #0C1714;
      --bg-3:          #111E1B;
      --bg-4:          #172623;
      --border:        #1D312E;
      --border-2:      #254340;
      --text:          #DCF0EE;
      --text-2:        #7EAAA6;
      --text-3:        #456460;
      --accent:        #1AA593;
      --accent-dim:    #0D5C57;
      --accent-glow:   rgba(26,165,147,0.12);
      --accent-glow-2: rgba(26,165,147,0.06);
      --warn:          #FF8C42;
      --warn-bg:       rgba(255,140,66,0.08);
      --danger:        #E63946;
      --sidebar-w:     268px;
      --toc-w:         216px;
      --header-h:      56px;
      --radius:        8px;
      --radius-lg:     12px;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-display:  'Poppins', sans-serif;
      --font-mono:     'JetBrains Mono', 'Fira Code', monospace;
      --shadow-sm:     0 1px 3px rgba(0,0,0,.4);
      --shadow:        0 4px 16px rgba(0,0,0,.5);
      --shadow-lg:     0 12px 40px rgba(0,0,0,.6);
      --transition:    160ms cubic-bezier(.4,0,.2,1);
    }

    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── Scrollbar ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

    /* ─── Header ─────────────────────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      background: rgba(7,14,13,.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px 0 0;
      gap: 0;
    }

    #header-logo {
      width: var(--sidebar-w);
      display: flex; align-items: center; gap: 10px;
      padding: 0 20px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .logo-mark {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(26,165,147,.3);
      flex-shrink: 0;
    }

    .logo-text {
      display: flex; align-items: baseline; gap: 5px;
    }
    .logo-name {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.05rem;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .logo-label {
      font-size: .7rem; font-weight: 500;
      color: var(--text-3);
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    #header-center {
      flex: 1;
      display: flex; align-items: center;
    }

    #header-actions {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    .hdr-badge {
      font-size: .7rem; font-weight: 600;
      font-family: var(--font-mono);
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(26,165,147,.2);
      border-radius: 99px;
      padding: 2px 9px;
      letter-spacing: .02em;
    }

    .hdr-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .8rem; font-weight: 500;
      font-family: var(--font-sans);
      color: var(--text-2);
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 12px;
      cursor: pointer; text-decoration: none;
      transition: var(--transition);
    }
    .hdr-btn:hover { color: var(--text); border-color: var(--border-2); background: var(--bg-4); }
    .hdr-btn svg { width: 14px; height: 14px; }

    .hdr-btn-accent {
      color: var(--accent);
      border-color: rgba(26,165,147,.25);
      background: var(--accent-glow-2);
    }
    .hdr-btn-accent:hover { background: var(--accent-glow); border-color: rgba(26,165,147,.4); color: var(--accent); }

    /* Mobile hamburger */
    #hamburger {
      display: none; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: none;
      background: transparent; cursor: pointer; color: var(--text-2);
      margin-right: 4px;
    }
    #hamburger svg { width: 20px; height: 20px; }

    /* ─── Layout ─────────────────────────────────────────────────── */
    #layout {
      display: flex;
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    /* ─── Sidebar ────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      top: var(--header-h);
      left: 0;
      bottom: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--bg-2);
      padding: 16px 0 40px;
      display: flex; flex-direction: column; gap: 0;
      z-index: 90;
      transition: transform var(--transition);
    }

    #search-wrap {
      padding: 0 12px 12px;
      position: sticky; top: 0;
      background: var(--bg-2);
      z-index: 2;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      padding-top: 4px;
    }

    #search {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: .8rem;
      padding: 7px 10px 7px 32px;
      outline: none;
      transition: var(--transition);
    }
    #search::placeholder { color: var(--text-3); }
    #search:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent-glow); }

    .search-icon-wrap {
      position: relative;
    }
    .search-ico {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none;
    }
    .search-ico svg { width: 14px; height: 14px; display: block; }

    .nav-section {
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .nav-section-label {
      font-size: .68rem; font-weight: 600;
      font-family: var(--font-display);
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-3);
      padding: 10px 8px 5px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--text-2);
      font-size: .82rem;
      cursor: pointer; text-decoration: none;
      transition: var(--transition);
      position: relative;
      user-select: none;
      border: 1px solid transparent;
    }
    .nav-item:hover { color: var(--text); background: var(--bg-3); }

    .nav-item.active {
      color: var(--accent);
      background: var(--accent-glow);
      border-color: rgba(26,165,147,.15);
      font-weight: 500;
    }
    .nav-item.active::before {
      content: '';
      position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
      width: 2px; height: 16px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-icon { width: 14px; height: 14px; opacity: .7; flex-shrink: 0; }
    .nav-item.active .nav-icon { opacity: 1; }

    /* ─── Main ───────────────────────────────────────────────────── */
    #main {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      min-width: 0;
    }

    #content-col {
      flex: 1;
      min-width: 0;
      padding: 48px 48px 96px;
      max-width: 820px;
    }

    /* ─── TOC ────────────────────────────────────────────────────── */
    #toc-col {
      width: var(--toc-w);
      flex-shrink: 0;
      padding: 48px 0 48px 16px;
    }

    #toc {
      position: sticky; top: calc(var(--header-h) + 24px);
      max-height: calc(100vh - var(--header-h) - 48px);
      overflow-y: auto;
    }

    #toc-label {
      font-size: .68rem; font-weight: 600;
      font-family: var(--font-display);
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-3);
      margin-bottom: 10px;
    }

    .toc-item {
      display: block;
      font-size: .78rem;
      color: var(--text-3);
      text-decoration: none;
      padding: 3px 0 3px 10px;
      border-left: 1px solid var(--border);
      transition: var(--transition);
      line-height: 1.4;
    }
    .toc-item:hover { color: var(--text-2); border-left-color: var(--border-2); }
    .toc-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
    .toc-item.toc-h3 { padding-left: 22px; font-size: .73rem; }

    /* ─── Content / Markdown ─────────────────────────────────────── */
    #content { opacity: 0; transition: opacity 200ms ease; }
    #content.visible { opacity: 1; }

    .md h1 {
      font-family: var(--font-display);
      font-size: 1.9rem; font-weight: 700;
      color: var(--text);
      letter-spacing: -.025em;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .md h1 + p { color: var(--text-2); font-size: 1rem; margin-bottom: 32px; }

    .md h2 {
      font-family: var(--font-display);
      font-size: 1.15rem; font-weight: 600;
      color: var(--text);
      letter-spacing: -.01em;
      margin-top: 48px; margin-bottom: 12px;
      padding-top: 48px;
      border-top: 1px solid var(--border);
    }
    .md h1 + h2,
    .md h1 + p + h2,
    .md h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    .md h3 {
      font-family: var(--font-display);
      font-size: .95rem; font-weight: 600;
      color: var(--text);
      margin-top: 28px; margin-bottom: 8px;
      letter-spacing: -.005em;
    }

    .md p { margin-bottom: 16px; color: var(--text-2); line-height: 1.75; }
    .md strong { color: var(--text); font-weight: 600; }
    .md em { color: var(--text-2); }

    .md a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .md a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* Inline code */
    .md code {
      font-family: var(--font-mono);
      font-size: .8em;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      color: var(--accent);
    }

    /* Code blocks */
    .md pre {
      background: var(--bg-3) !important;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 20px 0;
    }
    .md pre code {
      all: unset;
      display: block;
      font-family: var(--font-mono);
      font-size: .8rem;
      line-height: 1.7;
      padding: 20px;
      overflow-x: auto;
      color: #8EFCDE;
    }

    .code-wrapper { position: relative; }

    .code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px;
      background: var(--bg-4);
      border-bottom: 1px solid var(--border);
    }
    .code-lang {
      font-family: var(--font-mono);
      font-size: .7rem; font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .copy-btn {
      font-size: .72rem; font-weight: 500;
      font-family: var(--font-sans);
      color: var(--text-3);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 9px;
      cursor: pointer;
      transition: var(--transition);
    }
    .copy-btn:hover { color: var(--text-2); border-color: var(--border-2); }
    .copy-btn.ok { color: var(--accent); border-color: rgba(26,165,147,.3); }

    /* Tables */
    .md table {
      width: 100%; border-collapse: collapse;
      margin: 20px 0; font-size: .85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .md th {
      background: var(--bg-3);
      color: var(--text-2); font-weight: 600;
      font-size: .75rem; text-transform: uppercase; letter-spacing: .04em;
      padding: 10px 14px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .md td {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      color: var(--text-2);
    }
    .md tr:last-child td { border-bottom: none; }
    .md tr:nth-child(even) td { background: rgba(255,255,255,.015); }
    .md tr:hover td { background: var(--accent-glow-2); }

    /* Lists */
    .md ul, .md ol { padding-left: 20px; margin-bottom: 16px; }
    .md li { margin-bottom: 6px; color: var(--text-2); line-height: 1.7; }
    .md li::marker { color: var(--accent-dim); }

    /* Checklist */
    .md input[type="checkbox"] {
      appearance: none; width: 14px; height: 14px;
      border: 1.5px solid var(--border-2);
      border-radius: 3px; margin-right: 6px;
      vertical-align: middle; position: relative;
      background: var(--bg-3);
      flex-shrink: 0;
      cursor: default;
    }
    .md input[type="checkbox"]:checked {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }
    .md input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute; top: -2px; left: 1px;
      font-size: 10px; color: white;
    }
    .md li:has(input[type="checkbox"]) { list-style: none; margin-left: -20px; }

    /* HR */
    .md hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* ─── Callouts ───────────────────────────────────────────────── */
    .callout {
      display: flex; gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      margin: 20px 0;
      border-left: 3px solid;
    }
    .callout-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .callout-body { flex: 1; font-size: .85rem; line-height: 1.6; }
    .callout-body p { margin: 0; }
    .callout-body code { font-size: .78em; }

    .callout-note {
      background: var(--accent-glow-2);
      border-left-color: var(--accent);
    }
    .callout-note .callout-body { color: var(--text-2); }

    .callout-warning {
      background: var(--warn-bg);
      border-left-color: var(--warn);
    }
    .callout-warning .callout-body { color: #C8845A; }

    .callout-tip {
      background: rgba(13,92,87,.15);
      border-left-color: var(--accent-dim);
    }
    .callout-tip .callout-body { color: var(--text-2); }

    /* ─── Loading ────────────────────────────────────────────────── */
    #loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px;
      min-height: 300px; color: var(--text-3);
    }
    .loader {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error ──────────────────────────────────────────────────── */
    .load-error {
      text-align: center; padding: 48px 24px;
      color: var(--text-3);
    }
    .load-error .err-code {
      font-family: var(--font-mono);
      font-size: 3rem; font-weight: 700;
      color: var(--border-2);
      line-height: 1;
      margin-bottom: 12px;
    }
    .load-error p { font-size: .9rem; }

    /* ─── Mobile overlay ─────────────────────────────────────────── */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 89;
      backdrop-filter: blur(4px);
    }

    /* ─── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 1200px) {
      #toc-col { display: none; }
      #content-col { max-width: 100%; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-w: 260px; }
      #hamburger { display: flex; }
      #header-logo { width: auto; padding-left: 4px; }
      #sidebar {
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }
      #sidebar.open { transform: translateX(0); }
      #overlay.open { display: block; }
      #main { margin-left: 0; }
      #content-col { padding: 32px 20px 80px; }
      .md h1 { font-size: 1.5rem; }
      .md h2 { font-size: 1rem; }
    }

    /* ─── Util ───────────────────────────────────────────────────── */
    .hidden { display: none !important; }

    /* hljs override */
    .hljs { background: transparent !important; padding: 0 !important; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ HEADER -->
<header id="header">
  <button id="hamburger" aria-label="Toggle menu">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <a id="header-logo" href="#">
    <div class="logo-mark">🚌</div>
    <div class="logo-text">
      <span class="logo-name">PassBi</span>
      <span class="logo-label">Docs</span>
    </div>
  </a>

  <div id="header-center"></div>

  <div id="header-actions">
    <span class="hdr-badge">v2.0.0</span>
    <a class="hdr-btn hdr-btn-accent" href="api/openapi.yaml" target="_blank">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>

</header>

<!-- ═══════════════════════════════════════════════════════ OVERLAY -->
<div id="overlay"></div>

<!-- ═══════════════════════════════════════════════════════ LAYOUT -->
<div id="layout">

  <!-- ══════════════════════════════════════════════════ SIDEBAR -->
  <nav id="sidebar">
    <div id="search-wrap">
      <div class="search-icon-wrap">
        <span class="search-ico">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </span>
        <input type="search" id="search" placeholder="Search docs…" autocomplete="off" />
      </div>
    </div>

    <!-- Getting Started -->
    <div class="nav-section">
      <div class="nav-section-label">Getting Started</div>
      <a class="nav-item active" data-file="README.md">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Overview
      </a>
      <a class="nav-item" data-file="getting-started/quickstart.md">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Quickstart
      </a>
      <a class="nav-item" data-file="getting-started/authentication.md">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Authentication
      </a>

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
/* ─── Config ─────────────────────────────────────────────────── */
const BASE_URL = location.origin + location.pathname.replace(/\/[^/]*$/, '/');

/* ─── marked setup ────────────────────────────────────────────── */
marked.setOptions({ gfm: true, breaks: false });
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const safeCode = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="code-wrapper" data-raw="${encodeURIComponent(code)}">
    <div class="code-header">
      <span class="code-lang">${lang||'code'}</span>
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    </div>
    <pre><code class="language-${lang||'text'}">${safeCode}</code></pre>
  </div>`;
};
marked.setOptions({ renderer });

/* ─── DOM refs ────────────────────────────────────────────────── */
const contentEl = document.getElementById('content');
const tocNav    = document.getElementById('toc-nav');
const searchEl  = document.getElementById('search');
const sidebar   = document.getElementById('sidebar');
const overlay   = document.getElementById('overlay');
const hamburger = document.getElementById('hamburger');
const navItems  = document.querySelectorAll('.nav-item');

/* ─── Copy code ───────────────────────────────────────────────── */
function copyCode(btn) {
  const wrapper = btn.closest('.code-wrapper');
  const raw = decodeURIComponent(wrapper.dataset.raw);
  navigator.clipboard.writeText(raw).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
  });
}

/* ─── Callout post-processing ─────────────────────────────────── */
function processCallouts() {
  contentEl.querySelectorAll('blockquote').forEach(bq => {
    const text = bq.innerText.trim();
    let type = null, icon = '';
    if (text.startsWith('[!NOTE]'))    { type = 'note';    icon = 'ℹ'; }
    else if (text.startsWith('[!TIP]'))     { type = 'tip';     icon = '💡'; }
    else if (text.startsWith('[!WARNING]')) { type = 'warning'; icon = '⚠'; }
    else if (text.startsWith('[!IMPORTANT]')){ type = 'note';   icon = '📌'; }
    if (!type) return;

    const inner = bq.innerHTML
      .replace(/\[!NOTE\]/,'').replace(/\[!TIP\]/,'')
      .replace(/\[!WARNING\]/,'').replace(/\[!IMPORTANT\]/,'');
    const div = document.createElement('div');
    div.className = `callout callout-${type}`;
    div.innerHTML = `<span class="callout-icon">${icon}</span><div class="callout-body">${inner}</div>`;
    bq.replaceWith(div);
  });
}

/* ─── TOC generation ──────────────────────────────────────────── */
function buildTOC() {
  const headings = contentEl.querySelectorAll('h2, h3');
  tocNav.innerHTML = '';
  if (headings.length < 2) { document.getElementById('toc').style.display = 'none'; return; }
  document.getElementById('toc').style.display = '';
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'h-' + i;
    const a = document.createElement('a');
    a.className = 'toc-item' + (h.tagName==='H3' ? ' toc-h3' : '');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    tocNav.appendChild(a);
  });
  // IntersectionObserver for active TOC
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const link = tocNav.querySelector(`a[href="#${e.target.id}"]`);
      if (link) link.classList.toggle('active', e.isIntersecting);
    });
  }, { rootMargin: '-10% 0% -80% 0%' });
  headings.forEach(h => obs.observe(h));
}

/* ─── Internal link interception ──────────────────────────────── */
function interceptLinks() {
  contentEl.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (href && (href.endsWith('.md') || href.includes('.md#'))) {
      a.addEventListener('click', e => {
        e.preventDefault();
        const clean = href.startsWith('../') ? href.slice(3) : href;
        const [file, _anchor] = clean.split('#');
        loadFile(file);
        updateActiveNav(file);
      });
    }
  });
}

/* ─── Highlight all code ──────────────────────────────────────── */
function highlightAll() {
  contentEl.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}

/* ─── loadFile ────────────────────────────────────────────────── */
async function loadFile(filename, type = 'markdown') {
  // Fade out
  contentEl.classList.remove('visible');
  contentEl.innerHTML = `<div id="loading"><div class="loader"></div><span style="font-size:.85rem">Loading…</span></div>`;

  // Close mobile sidebar
  sidebar.classList.remove('open');
  overlay.classList.remove('open');

  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error(res.status);
    const raw = await res.text();

    if (type === 'yaml') {
      const highlighted = hljs.highlight(raw, { language: 'yaml' }).value;
      contentEl.innerHTML = `
        <h1>OpenAPI Specification</h1>
        <p>Machine-readable API spec — <a href="${filename}" download>Download YAML</a></p>
        <div class="code-wrapper" data-raw="${encodeURIComponent(raw)}">
          <div class="code-header">
            <span class="code-lang">yaml</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre><code class="language-yaml">${highlighted}</code></pre>
        </div>`;
    } else if (type === 'code') {
      const ext = filename.split('.').pop();
      const lang = { ts:'typescript', js:'javascript', py:'python' }[ext] || 'text';
      const highlighted = hljs.highlight(raw, { language: lang }).value;
      const safeName = filename.split('/').pop();
      contentEl.innerHTML = `
        <h1>${safeName}</h1>
        <div class="code-wrapper" data-raw="${encodeURIComponent(raw)}">
          <div class="code-header">
            <span class="code-lang">${lang}</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre><code class="language-${lang}">${highlighted}</code></pre>
        </div>`;
    } else {
      contentEl.innerHTML = marked.parse(raw);
      processCallouts();
      highlightAll();
    }

    buildTOC();
    interceptLinks();
    window.scrollTo({ top: 0 });

    // Fade in
    requestAnimationFrame(() => {
      requestAnimationFrame(() => contentEl.classList.add('visible'));
    });

  } catch (err) {
    contentEl.innerHTML = `
      <div class="load-error">
        <div class="err-code">${err.message === '404' ? '404' : 'ERR'}</div>
        <p>Could not load <code>${filename}</code></p>
        <p style="margin-top:8px;font-size:.8rem;color:var(--text-3)">Start the local server: <code>python3 -m http.server 3000</code></p>
      </div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => contentEl.classList.add('visible')));
  }
}

/* ─── updateActiveNav ─────────────────────────────────────────── */
function updateActiveNav(filename) {
  navItems.forEach(item => {
    item.classList.toggle('active', item.dataset.file === filename);
  });
}

/* ─── Nav click ───────────────────────────────────────────────── */
navItems.forEach(item => {
  item.addEventListener('click', e => {
    e.preventDefault();
    const file = item.dataset.file;
    const type = item.dataset.type || 'markdown';
    updateActiveNav(file);
    loadFile(file, type);
  });
});

/* ─── Search ──────────────────────────────────────────────────── */
searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase();
  navItems.forEach(item => {
    const match = item.textContent.toLowerCase().includes(q);
    item.style.display = match ? '' : 'none';
  });
  // Show all section labels
  document.querySelectorAll('.nav-section-label').forEach(l => l.style.display = '');
});

/* ─── Mobile sidebar ──────────────────────────────────────────── */
hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
});

/* ─── Logo click → home ───────────────────────────────────────── */
document.getElementById('header-logo').addEventListener('click', e => {
  e.preventDefault();
  updateActiveNav('README.md');
  loadFile('README.md');
});

/* ─── Boot ────────────────────────────────────────────────────── */
loadFile('README.md');
</script>
